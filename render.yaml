databases:
  - name: newsdb
    plan: free
    databaseName: newsdb

services:
  - type: web
    name: news-ai-backend
    runtime: python
    plan: free
    rootDir: international_news_ai
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: newsdb
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  - type: web
    name: news-ai-dashboard
    runtime: python
    plan: free
    rootDir: international_news_ai
    buildCommand: pip install -r ../requirements.txt
    startCommand: streamlit run dashboard/dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      # Backend's public URL, e.g. https://news-ai-backend.onrender.com
      - key: API_URL
        sync: false
